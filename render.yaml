services:
  - type: web
    name: backoffice-convivencia-escolar-staging-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    # La aplicación usa conexión pooled; las migraciones requieren la directa de Neon.
    preDeployCommand: DATABASE_URL=$DATABASE_URL_UNPOOLED pnpm --filter @backoffice/api prisma:migrate
    initialDeployHook: pnpm --filter @backoffice/api roles:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SHADOW_DATABASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SECURE
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
