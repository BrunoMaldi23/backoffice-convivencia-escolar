services:
  - type: web
    name: backoffice-convivencia-escolar-staging-api
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: pnpm --filter @backoffice/api prisma:migrate
    initialDeployHook: pnpm --filter @backoffice/api roles:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/private
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SHADOW_DATABASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SECURE
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
    disk:
      name: private-documents
      mountPath: /var/data
      sizeGB: 1
