name: backoffice-convivencia-escolar
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-convivencia}
      POSTGRES_USER: ${POSTGRES_USER:-convivencia_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    image: backoffice-convivencia-escolar-api
    command: sh -c "pnpm install --offline --frozen-lockfile && pnpm --filter @backoffice/api prisma:generate && pnpm --filter @backoffice/api prisma:migrate && pnpm --filter @backoffice/api dev"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      MAIL_FROM: ${MAIL_FROM:-no-reply@convivencia.example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-convivencia_app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-convivencia}?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER:-convivencia_app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@db:5432/convivencia_shadow?schema=public
    ports: ["3000:3000"]
    volumes:
      - api_workspace_node_modules:/workspace/node_modules
      - ./apps/api:/workspace/apps/api
      - ./packages/shared:/workspace/packages/shared
      # Oculta node_modules del host; pnpm resuelve los binarios desde la raíz de la imagen.
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    command: pnpm --filter @backoffice/web dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports: ["5173:5173"]
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/shared:/workspace/packages/shared
      # Oculta node_modules del host; pnpm resuelve los binarios desde la raíz de la imagen.
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      api: { condition: service_started }
  mailpit:
    image: axllent/mailpit:v1.28.1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
  api-test:
    profiles: [test]
    image: backoffice-convivencia-escolar-api
    working_dir: /workspace
    environment:
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      MAIL_FROM: no-reply@convivencia.example.com
      DATABASE_URL: postgresql://${POSTGRES_USER:-convivencia_app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@db:5432/convivencia_test?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER:-convivencia_app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@db:5432/convivencia_shadow?schema=public
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    command: pnpm --filter @backoffice/api test
volumes:
  postgres_data:
  api_node_modules:
  api_workspace_node_modules:
  web_node_modules:
